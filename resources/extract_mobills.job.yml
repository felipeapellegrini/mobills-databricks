resources:
  jobs:
    extract_mobills:
      name: Extract_Mobills
      tasks:
        - task_key: Extract_Mobills
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              payload: '{{job.parameters.parameters}}'
            notebook_path: ../src/extract/extract_mobills.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: bronze_cartoes
          depends_on:
            - task_key: Extract_Mobills
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              notebook_params: '{''table_name'': ''cartoes''}'
            notebook_path: ../src/z1_bronze/bronze_ingest.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: bronze_categorias
          depends_on:
            - task_key: Extract_Mobills
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              notebook_params: '{''table_name'': ''categorias''}'
            notebook_path: ../src/z1_bronze/bronze_ingest.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: bronze_contas
          depends_on:
            - task_key: Extract_Mobills
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              notebook_params: '{''table_name'': ''contas''}'
            notebook_path: ../src/z1_bronze/bronze_ingest.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: bronze_orcamentos
          depends_on:
            - task_key: Extract_Mobills
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              notebook_params: '{''table_name'': ''orcamentos'', ''businessdate_col'': ''data''}'
            notebook_path: ../src/z1_bronze/bronze_ingest.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: bronze_transacoes
          depends_on:
            - task_key: Extract_Mobills
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              notebook_params: '{''table_name'': ''transacoes'', ''businessdate_col'': ''data''}'
            notebook_path: ../src/z1_bronze/bronze_ingest.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: silver_cartoes
          depends_on:
            - task_key: bronze_cartoes
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              silver_params: '{''table_name'': ''cartoes'', ''natural_keys'': [''id'']}'
            notebook_path: ../src/z2_silver/silver_process.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: gold_cartoes
          depends_on:
            - task_key: silver_cartoes
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              gold_params: '{"table_name": "cartoes",  "natural_key": [''nome'']}'
            notebook_path: ../src/z3_gold/gold_scd1.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: silver_categorias
          depends_on:
            - task_key: bronze_categorias
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              silver_params: '{''table_name'': ''categorias'', ''natural_keys'': [''id'']}'
            notebook_path: ../src/z2_silver/silver_process.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: gold_categorias
          depends_on:
            - task_key: silver_categorias
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              gold_params: '{"table_name": "categorias",  "natural_key": [''natureza'', ''categoriaPai'', ''categoria'']}'
            notebook_path: ../src/z3_gold/gold_scd1.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: silver_contas
          depends_on:
            - task_key: bronze_contas
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              silver_params: '{''table_name'': ''contas'', ''natural_keys'': [''id'']}'
            notebook_path: ../src/z2_silver/silver_process.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: gold_contas
          depends_on:
            - task_key: silver_contas
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              gold_params: '{"table_name": "contas",  "natural_key": [''nome'']}'
            notebook_path: ../src/z3_gold/gold_scd1.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: silver_orcamentos
          depends_on:
            - task_key: bronze_orcamentos
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              silver_params: '{''table_name'': ''orcamentos'', ''natural_keys'': [''subcategoria'', ''categoria'', ''_businessdate'']}'
            notebook_path: ../src/z2_silver/silver_process.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: gold_orcamentos
          depends_on:
            - task_key: silver_orcamentos
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/z3_gold/gold_orcamentos.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: silver_transacoes
          depends_on:
            - task_key: bronze_transacoes
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              silver_params: '{''table_name'': ''transacoes'', ''natural_keys'': [''id'', ''conta_id'', ''_businessdate'']}'
            notebook_path: ../src/z2_silver/silver_process.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: gold_transacoes
          depends_on:
            - task_key: silver_cartoes
            - task_key: silver_categorias
            - task_key: silver_contas
            - task_key: silver_transacoes
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/z3_gold/gold_transacoes.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: gold_calendar
          depends_on:
            - task_key: gold_orcamentos
            - task_key: gold_transacoes
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/z4_dashboard/gold_calendar.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: gold_monthly_cashflow
          depends_on:
            - task_key: gold_transacoes
            - task_key: gold_orcamentos
            - task_key: gold_calendar
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/z4_dashboard/gold_monthly_cashflow.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: purge_source
          depends_on:
            - task_key: gold_transacoes
            - task_key: gold_contas
            - task_key: gold_cartoes
            - task_key: gold_orcamentos
            - task_key: gold_categorias
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/z1_bronze/purge.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      parameters:
        - name: parameters
          default: ""
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
