resources:
  jobs:
    etl_mobills:
      name: Orchestrator Mobills
      tasks:
        - task_key: extract_mobills
          notebook_task:
            notebook_path: ../src/extract/extract_mobills.ipynb
            base_parameters:
              payload: "{{job.parameters.hash}}"
              refdate: "{{job.parameters.refdate}}"
              budget: "{{jobs.parameters.budget}}"
        - task_key: pipeline
          depends_on:
            - task_key: extract_mobills
          pipeline_task:
            pipeline_id: ${resources.pipelines.pl_mobills.id}
          max_retries: 2
        - task_key: grants
          depends_on:
            - task_key: pipeline
          notebook_task:
            notebook_path: ../src/post_deploy/post_deploy.ipynb
        - task_key: purge_csvs
          depends_on:
            - task_key: pipeline
          notebook_task:
            notebook_path: ../src/purge_csv/purge.ipynb
      queue:
        enabled: true
      parameters:
        - name: hash
          default: ""
        - name: refdate
          default: ""
        - name: budget
          default: "true"
