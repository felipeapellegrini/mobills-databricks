# This is a Declarative Automation Bundle definition for mobills_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: mobills_databricks
  uuid: ee069911-1e3c-45ac-8f77-994a0ea6f593

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  flag_dev:
    description: Flag to point development mode

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-bd83e171-6ecf.cloud.databricks.com
    variables:
      catalog: mobills
      schema: ${workspace.current_user.short_name}
      flag_dev: true
  prod:
    mode: production
    workspace:
      host: https://dbc-bd83e171-6ecf.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/felipeapellegrini@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mobills
      schema: prod
      flag_dev: false
    permissions:
      - user_name: felipeapellegrini@gmail.com
        level: CAN_MANAGE
      - group_name: users
        level: CAN_MANAGE
